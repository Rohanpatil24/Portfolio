<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quantum Vault Access | Rohan Patil</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Icons & Styling -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Space Grotesk', 'monospace'],
                    },
                    colors: {
                        slate: {
                            850: '#0b0f19',
                            900: '#07090e',
                            950: '#030406',
                        },
                        teal: {
                            400: '#2dd4bf',
                            500: '#14b8a6',
                            600: '#0d9488',
                        }
                    }
                }
            }
        }
    </script>
    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <style>
        #vault-canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* Ultra-Transparent Glassmorphism */
        .vault-glass {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1), inset 0 1px 1px rgba(255, 255, 255, 0.8);
            transition: all 0.4s ease;
        }
        .dark .vault-glass {
            background: rgba(11, 15, 25, 0.45);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(20, 184, 166, 0.25);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            transition: all 0.4s ease;
        }

        /* 3-Failed-Attempts Critical Alert State */
        .lockout-glow {
            border: 2px solid #ef4444 !important;
            box-shadow: 0 0 45px rgba(239, 68, 68, 0.75), inset 0 0 20px rgba(239, 68, 68, 0.3) !important;
            animation: alarmPulse 1.2s infinite alternate ease-in-out;
        }

        @keyframes alarmPulse {
            0% { box-shadow: 0 0 25px rgba(239, 68, 68, 0.4); }
            100% { box-shadow: 0 0 60px rgba(239, 68, 68, 0.9); }
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(203, 213, 225, 0.7);
            backdrop-filter: blur(10px);
        }
        .dark .glass-input {
            background: rgba(15, 23, 42, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
        }

        /* 3D Imprint Glyph Stream Animation */
        .glyph-imprint {
            display: inline-block;
            animation: imprintVaporize 0.85s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
            filter: drop-shadow(0 0 8px rgba(20, 184, 166, 0.9));
            transform-origin: center bottom;
        }

        @keyframes imprintVaporize {
            0% {
                opacity: 0;
                transform: translateY(12px) scale(0.6) rotateX(45deg);
            }
            30% {
                opacity: 1;
                transform: translateY(0) scale(1.15) rotateX(0deg);
                filter: drop-shadow(0 0 15px rgba(45, 212, 191, 1));
            }
            70% {
                opacity: 0.8;
                transform: translateY(-8px) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-24px) scale(0.8) skewX(-15deg);
                filter: blur(4px) drop-shadow(0 0 2px rgba(20, 184, 166, 0));
            }
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex items-center justify-center relative overflow-hidden font-sans transition-colors duration-300">

    <!-- Three.js 3D Vault Canvas -->
    <div id="vault-canvas"></div>

    <!-- Theme Switcher -->
    <div class="absolute top-6 right-6 z-20">
        <button id="theme-toggle" class="relative w-11 h-11 flex items-center justify-center rounded-2xl bg-white/50 dark:bg-slate-900/50 backdrop-blur-md text-slate-700 dark:text-teal-400 border border-slate-300/80 dark:border-slate-800 hover:border-teal-500 shadow-lg transition-all overflow-hidden group">
            <i class="ph ph-sun text-xl absolute transition-all duration-500 translate-y-10 opacity-0 dark:translate-y-0 dark:opacity-100 group-hover:rotate-45"></i>
            <i class="ph ph-moon text-xl absolute transition-all duration-500 translate-y-0 opacity-100 dark:-translate-y-10 dark:opacity-0 group-hover:-rotate-12"></i>
        </button>
    </div>

    <!-- Central Security Card -->
    <div id="vault-card" class="vault-glass w-11/12 max-w-md p-8 sm:p-10 rounded-3xl relative z-10 transition-all duration-300">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <div id="vault-emblem" class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-teal-500/10 border border-teal-500/30 text-teal-600 dark:text-teal-400 text-3xl mb-3 shadow-inner backdrop-blur-sm transition-all">
                <i class="ph ph-vault"></i>
            </div>
            <h1 class="text-2xl font-bold font-mono tracking-wider text-slate-900 dark:text-white uppercase">
                Vault<span id="title-dot" class="text-teal-500">.</span>Gateway
            </h1>
            <p id="security-subtext" class="text-xs font-mono text-slate-500 dark:text-slate-400 mt-1">Biometric Cipher & Credential Interface</p>
        </div>

        <!-- Failure Banner -->
        <div id="fail-alert" class="hidden mb-4 p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-500 text-xs font-mono text-center flex items-center justify-center gap-2">
            <i class="ph ph-warning-circle text-base"></i>
            <span id="fail-alert-msg">UNAUTHORIZED ACCESS</span>
        </div>

        <!-- 3D Holographic Telemetry Stream Box -->
        <div class="h-12 w-full mb-4 px-4 rounded-xl bg-white/40 dark:bg-slate-900/40 border border-slate-300/60 dark:border-teal-500/20 backdrop-blur-md flex items-center justify-between font-mono text-xs overflow-hidden relative shadow-inner">
            <div class="flex items-center gap-2">
                <span id="telemetry-dot" class="w-2 h-2 rounded-full bg-teal-500 animate-pulse"></span>
                <span class="text-slate-500 dark:text-slate-400 uppercase tracking-widest text-[10px]">Imprint:</span>
            </div>
            <div id="hologram-stream" class="flex gap-1.5 font-bold text-teal-600 dark:text-teal-400 text-base"></div>
        </div>

        <!-- Submission Form -->
        <form id="vault-form" class="space-y-5">
            {% csrf_token %}
            
            <div>
                <label class="block text-xs font-mono uppercase tracking-wider text-slate-600 dark:text-slate-400 mb-2 flex items-center justify-between">
                    <span>Identity String</span>
                    <span class="text-[10px] text-teal-600 dark:text-teal-400 font-bold">USER_ID</span>
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <i class="ph ph-fingerprint text-lg"></i>
                    </span>
                    <input type="text" name="username" id="vault_username" autocomplete="off" class="glass-input w-full pl-10 pr-4 py-3 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-transparent outline-none text-slate-900 dark:text-white font-mono text-sm transition-all" placeholder="Enter username" required>
                </div>
            </div>

            <div>
                <label class="block text-xs font-mono uppercase tracking-wider text-slate-600 dark:text-slate-400 mb-2 flex items-center justify-between">
                    <span>Security Cipher</span>
                    <span class="text-[10px] text-teal-600 dark:text-teal-400 font-bold">PASS_CIPHER</span>
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <i class="ph ph-key text-lg"></i>
                    </span>
                    <input type="password" name="password" id="vault_password" autocomplete="off" class="glass-input w-full pl-10 pr-4 py-3 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-transparent outline-none text-slate-900 dark:text-white font-mono text-sm transition-all" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" id="auth-btn" class="w-full py-4 rounded-xl bg-teal-500/90 hover:bg-teal-500 dark:hover:bg-teal-400 text-white dark:text-slate-950 font-bold font-mono text-sm uppercase tracking-wider transition-all shadow-[0_0_25px_rgba(20,184,166,0.35)] flex items-center justify-center gap-2 backdrop-blur-sm">
                <i class="ph ph-lock-key-open text-lg"></i> Authorize Entry
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="/" class="text-xs text-slate-500 hover:text-teal-500 dark:hover:text-teal-400 transition-colors font-mono">&larr; Return to Safe Perimeter</a>
        </div>
    </div>

    <!-- Hacker Verification Terminal Modal -->
    <div id="hacker-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-950/80 backdrop-blur-xl transition-opacity duration-300">
        <div id="hacker-box" class="w-11/12 max-w-lg rounded-2xl p-6 font-mono text-xs md:text-sm bg-slate-900/90 backdrop-blur-2xl border border-teal-500/40 shadow-2xl text-slate-100 relative transition-all">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
                <div class="flex items-center gap-2">
                    <span id="dot-red" class="w-3 h-3 rounded-full bg-red-500"></span>
                    <span id="dot-yellow" class="w-3 h-3 rounded-full bg-yellow-500"></span>
                    <span id="dot-green" class="w-3 h-3 rounded-full bg-green-500"></span>
                    <span class="text-slate-400 ml-2 font-bold tracking-widest text-xs">CIPHER_HANDSHAKE_DAEMON</span>
                </div>
                <div id="terminal-spinner" class="w-4 h-4 border-2 border-teal-500 border-t-transparent rounded-full animate-spin"></div>
            </div>
            
            <div id="terminal-logs" class="space-y-2 text-teal-400 min-h-[140px] max-h-[200px] overflow-y-auto mb-4">
                <p class="text-slate-400">> Initiating Quantum Key Exchange (QKE)...</p>
            </div>

            <div id="terminal-status" class="hidden pt-3 border-t border-slate-800 flex justify-between items-center">
                <span id="status-text" class="font-bold tracking-widest"></span>
            </div>
        </div>
    </div>

    <script>
        // 1. THEME ENGINE
        const themeToggleBtn = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;

        themeToggleBtn.addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            updateThreeColors(isDark);
        });

        // 2. THREE.JS CIPHER VAULT CANVAS ENGINE
        const container = document.getElementById('vault-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        camera.position.z = 14;

        // Outer Ring
        const ringGeo = new THREE.TorusGeometry(5, 0.08, 16, 80);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x14b8a6, wireframe: true, transparent: true, opacity: 0.35 });
        const vaultRing = new THREE.Mesh(ringGeo, ringMat);
        scene.add(vaultRing);

        // Inner Spinning Gate
        const innerGateGeo = new THREE.TorusGeometry(3.5, 0.04, 8, 40);
        const innerGateMat = new THREE.MeshBasicMaterial({ color: 0x2dd4bf, wireframe: true, transparent: true, opacity: 0.5 });
        const innerGate = new THREE.Mesh(innerGateGeo, innerGateMat);
        scene.add(innerGate);

        // Particle Field
        const particleCount = 450;
        const particleGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount * 3; i++) {
            positions[i] = (Math.random() - 0.5) * 35;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particleMat = new THREE.PointsMaterial({ size: 0.09, color: 0x14b8a6, transparent: true, opacity: 0.75 });
        const particleField = new THREE.Points(particleGeo, particleMat);
        scene.add(particleField);

        function updateThreeColors(isDark, overrideColor = null) {
            if (overrideColor) {
                ringMat.color.setHex(overrideColor);
                innerGateMat.color.setHex(overrideColor);
                particleMat.color.setHex(overrideColor);
                return;
            }
            ringMat.color.setHex(isDark ? 0x14b8a6 : 0x0d9488);
            innerGateMat.color.setHex(isDark ? 0x2dd4bf : 0x14b8a6);
            particleMat.color.setHex(isDark ? 0x14b8a6 : 0x0d9488);
        }
        updateThreeColors(htmlElement.classList.contains('dark'));

        let targetX = 0, targetY = 0;
        window.addEventListener('mousemove', (e) => {
            targetX = (e.clientX - window.innerWidth / 2) * 0.0008;
            targetY = (e.clientY - window.innerHeight / 2) * 0.0008;
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getElapsedTime();

            vaultRing.rotation.z = delta * 0.12;
            innerGate.rotation.z = -delta * 0.22;
            innerGate.rotation.x = Math.sin(delta * 0.5) * 0.2;
            particleField.rotation.y = delta * 0.04;

            camera.position.x += (targetX * 6 - camera.position.x) * 0.05;
            camera.position.y += (-targetY * 6 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 3. 3D GLYPH IMPRINTING & VAPORIZATION
        const streamContainer = document.getElementById('hologram-stream');
        const usernameInput = document.getElementById('vault_username');
        const passwordInput = document.getElementById('vault_password');

        function triggerGlyphImprint(char, isMasked = false) {
            const span = document.createElement('span');
            span.className = 'glyph-imprint';
            span.textContent = isMasked ? '✦' : char;
            streamContainer.appendChild(span);

            vaultRing.scale.set(1.03, 1.03, 1.03);
            setTimeout(() => vaultRing.scale.set(1, 1, 1), 120);
            setTimeout(() => span.remove(), 850);
        }

        usernameInput.addEventListener('input', (e) => { if (e.data) triggerGlyphImprint(e.data, false); });
        passwordInput.addEventListener('input', (e) => { if (e.data) triggerGlyphImprint('*', true); });

        // 4. ATTEMPT TRACKER & REAL-TIME AUTH LOGIC
        let failedAttempts = 0;
        const vaultCard = document.getElementById('vault-card');
        const failAlert = document.getElementById('fail-alert');
        const failAlertMsg = document.getElementById('fail-alert-msg');
        const form = document.getElementById('vault-form');
        const modal = document.getElementById('hacker-modal');
        const hackerBox = document.getElementById('hacker-box');
        const logs = document.getElementById('terminal-logs');
        const spinner = document.getElementById('terminal-spinner');
        const statusBox = document.getElementById('terminal-status');
        const statusText = document.getElementById('status-text');

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (failedAttempts >= 3) return;

            const username = usernameInput.value;
            const password = passwordInput.value;
            const csrfToken = getCookie('csrftoken');

            // Open Terminal Simulation
            modal.classList.remove('hidden');
            hackerBox.className = "w-11/12 max-w-lg rounded-2xl p-6 font-mono text-xs md:text-sm bg-slate-900/90 backdrop-blur-2xl border border-teal-500/40 shadow-2xl text-slate-100 relative transition-all";
            logs.innerHTML = '<p class="text-slate-400">> Initiating Quantum Handshake protocol...</p>';
            statusBox.classList.add('hidden');
            spinner.classList.remove('hidden');

            // Kick off asynchronous credentials check in parallel
            const authPromise = fetch("{% url 'login' %}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest',
                    'X-CSRFToken': csrfToken
                },
                body: JSON.stringify({ username: username, password: password })
            }).then(res => res.json().then(data => ({ ok: res.ok, data })));

            setTimeout(() => {
                const p = document.createElement('p');
                p.className = 'text-teal-300';
                p.textContent = '> Verifying RSA-4096 hash with enclave...';
                logs.appendChild(p);
            }, 600);

            setTimeout(async () => {
                try {
                    const result = await authPromise;
                    spinner.classList.add('hidden');
                    statusBox.classList.remove('hidden');

                    if (result.ok && result.data.status === 'success') {
                        // SUCCESS
                        statusText.className = 'text-green-400 font-bold';
                        statusText.textContent = '[ STATUS: ACCESS_GRANTED // 200 OK ]';
                        
                        const p = document.createElement('p');
                        p.className = 'text-green-400 font-bold';
                        p.textContent = '> Authorization validated. Routing to Command Dashboard...';
                        logs.appendChild(p);

                        setTimeout(() => {
                            window.location.href = result.data.redirect_url || '/dashboard/';
                        }, 900);
                    } else {
                        // FAILURE / UNAUTHORIZED
                        failedAttempts++;
                        updateThreeColors(false, 0xef4444); // Flash 3D canvas Red

                        hackerBox.className = "w-11/12 max-w-lg rounded-2xl p-6 font-mono text-xs md:text-sm bg-slate-900/95 backdrop-blur-2xl border border-red-500/80 shadow-[0_0_50px_rgba(239,68,68,0.5)] text-slate-100 relative transition-all";
                        statusText.className = 'text-red-500 font-bold';
                        statusText.textContent = '[ STATUS: 401 UNAUTHORIZED // ACCESS DENIED ]';

                        const errLine = document.createElement('p');
                        errLine.className = 'text-red-400 font-bold';
                        errLine.textContent = `> CRITICAL: ${result.data.msg || 'Invalid Credentials'}. Attempt ${failedAttempts}/3.`;
                        logs.appendChild(errLine);

                        setTimeout(() => {
                            modal.classList.add('hidden');
                            updateThreeColors(htmlElement.classList.contains('dark'));
                            
                            failAlert.classList.remove('hidden');
                            failAlertMsg.textContent = `UNAUTHORIZED ACCESS: Invalid credentials. (${failedAttempts}/3 attempts)`;

                            // 3RD STRIKE LOCKOUT
                            if (failedAttempts >= 3) {
                                vaultCard.classList.add('lockout-glow');
                                failAlertMsg.textContent = 'SECURITY LOCKOUT DETECTED. Ejecting to safe perimeter in 3s...';
                                document.getElementById('auth-btn').disabled = true;
                                document.getElementById('auth-btn').className = "w-full py-4 rounded-xl bg-red-600/80 text-white font-bold font-mono text-sm uppercase tracking-wider cursor-not-allowed";
                                document.getElementById('auth-btn').textContent = "SYSTEM LOCKED";

                                let secondsLeft = 3;
                                const interval = setInterval(() => {
                                    secondsLeft--;
                                    if (secondsLeft > 0) {
                                        failAlertMsg.textContent = `SECURITY LOCKOUT DETECTED. Ejecting to safe perimeter in ${secondsLeft}s...`;
                                    } else {
                                        clearInterval(interval);
                                        window.location.href = '/';
                                    }
                                }, 1000);
                            }
                        }, 1800);
                    }
                } catch (err) {
                    spinner.classList.add('hidden');
                    statusBox.classList.remove('hidden');
                    statusText.className = 'text-red-400';
                    statusText.textContent = '[ CONNECTION ERROR ]';
                    setTimeout(() => modal.classList.add('hidden'), 1200);
                }
            }, 1400);
        });
    </script>
</body>
</html>
